workflows:
  android-capacitor-build:
    name: Heart Goals Native Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 22
      vars:
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build web application static assets
        script: |
          npm run build
      - name: Initialize Capacitor and add Android platform
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo $JAVA_HOME)
          # If android folder doesn't exist yet, initialize it
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Copy google-services.json to android/app directory if it exists
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "Successfully copied google-services.json to android/app/"
          else
            echo "Warning: google-services.json not found in root. Please upload it to your project root."
          fi
      - name: Synchronize web assets to native Android container
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo $JAVA_HOME)
          npx cap sync
      - name: Build native Android Debug APK
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo $JAVA_HOME)
          cd android
          # Update version code and name in build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
          sed -i "s/versionName \"[0-9.]*\"/versionName \"1.0.$BUILD_NUMBER\"/" app/build.gradle
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
