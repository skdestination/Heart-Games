workflows:
  android-capacitor-build:
    name: Heart Goals Native Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build web application static assets
        script: |
          npm run build
      - name: Initialize Capacitor and add Android platform
        script: |
          # If android folder doesn't exist yet, initialize it
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Synchronize web assets to native Android container
        script: |
          npx cap sync
      - name: Build native Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
